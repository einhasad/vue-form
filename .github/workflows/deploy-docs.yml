name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build library (examples imports source via aliases, but build it anyway for parity)
        run: npm run build
      - name: Build demo site
        working-directory: examples
        env:
          BASE_PATH: /vue-form/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with `workflow` build type if it isn't already.
          # Without this, the first run on a new repo / fork fails with
          # `HttpError: Not Found - .../pages` (see run 25073184279).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
